[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ngm-panel"
version = "1.1.0"
description = "Local-only terminal panel for Windows and Termux: scoped network/web diagnostics, OSINT research helpers, system inspection and controlled load testing."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ngm-panel" }]
keywords = ["cli", "windows", "termux", "android", "network", "osint", "diagnostics", "terminal"]
classifiers = [
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Android",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
ngm-panel = "ngm_panel.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "pyinstaller>=6.0"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["ngm_panel*"]

[tool.setuptools.package-data]
"ngm_panel.data" = ["*.json"]
