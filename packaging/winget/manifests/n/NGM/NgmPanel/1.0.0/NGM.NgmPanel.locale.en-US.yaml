ShortDescription: Local-only Windows terminal panel for scoped network, web and system diagnostics.
Description: >-
  ngm-panel runs 100% locally inside its own process on your machine. It provides a
  full-screen terminal panel with 1,300+ commands covering DNS/IP lookups, TCP port
  checks, web/TLS inspection, controlled L7/L4 load tests, Windows system/process
  inspection and file utilities. Every outbound command is checked against an
  authorized-scope file with rate, concurrency, timeout and request caps.
